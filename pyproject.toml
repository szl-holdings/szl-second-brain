[project]
name = "szl-second-brain"
version = "1.1.0"
description = "Governed hybrid public retrieval with controller-only authorized hydration. Handles only on public surfaces; Lambda = Conjecture 1."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "SZL Holdings" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
