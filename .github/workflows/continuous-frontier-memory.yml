# SPDX-License-Identifier: Apache-2.0
name: Continuous frontier memory

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this bounded discovery pass is being run"
        required: false
        default: "manual frontier refresh"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: continuous-frontier-memory
  cancel-in-progress: true

jobs:
  refresh:
    if: github.repository == 'szl-holdings/szl-second-brain'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RECEIPT: reports/continuous-frontier-memory.json
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the source-test toolchain
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          -r requirements.txt "pytest>=8,<9" "build>=1.2,<2"

      - name: Refresh the six fixed public source contracts
        id: refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          before="$(git rev-parse HEAD)"
          python scripts/refresh_frontier_memory.py | tee reports/frontier-refresh-output.json
          python -m py_compile scripts/refresh_frontier_memory.py second_brain/frontier.py app_operational.py
          PYTHONPATH=. python -m pytest -q
          python -m build --wheel
          git diff --check
          changed=false
          if ! git diff --quiet -- data/frontier-candidates.public.jsonl data/frontier-state.v1.json; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "source_sha=$before" >> "$GITHUB_OUTPUT"
          echo "candidate_digest=$(python -c 'import json; print(json.load(open("data/frontier-state.v1.json"))["candidate_set_sha256"])')" >> "$GITHUB_OUTPUT"

      - name: Recheck protected main at the write boundary
        if: steps.refresh.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          checked_out="$(git rev-parse HEAD)"
          current_main="$(git rev-parse origin/main)"
          if [ "$checked_out" != "$current_main" ]; then
            echo "::error::Protected main moved during discovery; refusing a stale proposal."
            exit 3
          fi

      - name: Create one content-addressed review pull request
        id: proposal
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          digest="${{ steps.refresh.outputs.candidate_digest }}"
          branch="automation/frontier-memory-${digest:0:16}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          existing="$(gh pr list --state open --head "$branch" --json url --jq '.[0].url // ""')"
          if [ -n "$existing" ]; then
            echo "state=EXISTING_REVIEW_PR" >> "$GITHUB_OUTPUT"
            echo "pr_url=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "state=EXISTING_BRANCH_NO_FORCE" >> "$GITHUB_OUTPUT"
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git switch -c "$branch"
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add data/frontier-candidates.public.jsonl data/frontier-state.v1.json
          git diff --cached --quiet && { echo "::error::Expected candidate changes are absent"; exit 4; }
          git commit -s -m "chore(brain): propose frontier memory ${digest:0:16}"
          git push origin "HEAD:$branch"
          body="$(printf '%s\n' \
            '## Bounded discovery proposal' \
            '' \
            'This automated proposal refreshes only the fixed public-source candidate corpus and exact source receipts.' \
            '' \
            "- Candidate set: \`${digest}\`" \
            '- Public API: handles and digests only' \
            '- Candidate state: `DISCOVERED_REVIEW_REQUIRED`' \
            '- Training authority: `NONE`' \
            '- Promotion authority: `NONE`' \
            '- Execution authority: `NONE`' \
            '- Merge authority: `NONE`' \
            '' \
            'The workflow ran the complete source tests and wheel build. Human review remains required; this workflow cannot merge the PR, train a model, publish weights, expose private graph content, or mutate a provider.' \
            '' \
            'Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>')"
          pr_url="$(gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(brain): review frontier memory ${digest:0:16}" \
            --body "$body")"
          echo "state=NEW_REVIEW_PR" >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Write the secret-free loop receipt
        if: always()
        shell: bash
        env:
          CHANGED: ${{ steps.refresh.outputs.changed || 'false' }}
          SOURCE_SHA: ${{ steps.refresh.outputs.source_sha || github.sha }}
          CANDIDATE_DIGEST: ${{ steps.refresh.outputs.candidate_digest || '' }}
          PROPOSAL_STATE: ${{ steps.proposal.outputs.state || 'NO_PROPOSAL' }}
          PROPOSAL_BRANCH: ${{ steps.proposal.outputs.branch || '' }}
          PROPOSAL_URL: ${{ steps.proposal.outputs.pr_url || '' }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RECEIPT")"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          state_path = Path("data/frontier-state.v1.json")
          state = json.loads(state_path.read_text(encoding="utf-8")) if state_path.is_file() else {}
          receipt = {
              "schema": "szl.second-brain.continuous-frontier-run/v1",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "source_repository": os.environ["GITHUB_REPOSITORY"],
              "source_revision": os.environ.get("SOURCE_SHA") or os.environ["GITHUB_SHA"],
              "changed": os.environ.get("CHANGED") == "true",
              "candidate_set_sha256": os.environ.get("CANDIDATE_DIGEST") or state.get("candidate_set_sha256"),
              "candidate_count": state.get("candidate_count"),
              "source_count": state.get("source_count"),
              "proposal": {
                  "state": os.environ.get("PROPOSAL_STATE") or "NO_PROPOSAL",
                  "branch": os.environ.get("PROPOSAL_BRANCH") or None,
                  "url": os.environ.get("PROPOSAL_URL") or None,
              },
              "authority": {
                  "content_access": "HANDLES_ONLY_PUBLIC_AUTHORIZED_CONTROLLER_ONLY",
                  "training": "NONE",
                  "promotion": "NONE",
                  "execution": "NONE",
                  "merge": "NONE",
                  "provider_mutation": "NONE",
              },
          }
          Path(os.environ["RECEIPT"]).write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Retain the immutable continuous-memory receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: continuous-frontier-memory-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.RECEIPT }}
            reports/frontier-refresh-output.json
          if-no-files-found: error
          retention-days: 90
