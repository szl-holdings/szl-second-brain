name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install source-test toolchain
        run: python -m pip install --disable-pip-version-check -r requirements.txt "pytest>=8,<9" "build>=1.2,<2"
      - name: Run source tests
        run: PYTHONPATH=. python -m pytest -q
      - name: Build wheel
        run: python -m build --wheel
      - name: Prove installed-mode corpus, retrieval, frontier memory, and hydration
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/szl-second-brain-installed"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check --no-deps dist/*.whl
          (
            cd "$RUNNER_TEMP"
            "$venv/bin/python" - <<'PY'
          import importlib.metadata
          from second_brain import (
              AuthorizedFrontierHydrator,
              AuthorizedHydrator,
              __version__,
              anatomy_feed,
              frontier_search,
              frontier_status,
              hybrid_context,
              index,
          )

          assert __version__ == importlib.metadata.version("szl-second-brain") == "1.3.0"
          brain = index()
          assert brain.built is True, brain.load_error
          assert brain.n == 575
          assert brain.path.is_file()
          assert brain.path.name == "brain-corpus.public.jsonl"

          context = hybrid_context("Lambda uniqueness conjecture", k=4)
          assert context["ready"] is True
          assert context["content_access"] == "HANDLES_ONLY"
          assert context["handles"]

          hydrator = AuthorizedHydrator(lambda *_args: True)
          hydrated = hydrator.hydrate(
              context["handles"],
              principal_id="installed-mode-principal",
              tenant_id="installed-mode-tenant",
              policy_revision="a" * 40,
          )
          assert hydrated["state"] == "AUTHORIZED_CONTENT_READY"
          assert hydrated["content_access"] == "CONTROLLER_ONLY"
          assert len(hydrated["documents"]) == len(context["handles"])
          assert hydrated["evidence_set_sha256"] == context["evidence_set_sha256"]
          assert hydrated["raw_graph_nodes_admitted_to_gradients"] == 0

          frontier = frontier_status()
          assert frontier["ready"] is True
          assert frontier["state"] == "REVIEW_REQUIRED"
          assert frontier["candidate_count"] >= 70
          assert frontier["source_count"] == 7
          assert frontier["training_authority"] == "NONE"
          assert frontier["promotion_authority"] == "NONE"
          assert frontier["execution_authority"] == "NONE"

          review = frontier_search("formula quant anatomy ouroboros", k=8)
          assert review["content_access"] == "HANDLES_ONLY"
          assert review["handles"]
          assert all("content" not in handle for handle in review["handles"])

          feed = anatomy_feed(k=12)
          assert feed["purpose"] == "READ_ONLY_LIVING_ANATOMY_OBSERVATION"
          assert feed["execution_authority"] == "NONE"

          frontier_hydrator = AuthorizedFrontierHydrator(lambda *_args: True)
          review_content = frontier_hydrator.hydrate(
              review["handles"],
              principal_id="installed-mode-reviewer",
              tenant_id="installed-mode-tenant",
              policy_revision="frontier-policy-v1",
          )
          assert review_content["state"] == "AUTHORIZED_REVIEW_CONTENT_READY"
          assert review_content["content_access"] == "CONTROLLER_ONLY"
          assert review_content["training_authority"] == "NONE"
          assert review_content["promotion_authority"] == "NONE"
          assert review_content["execution_authority"] == "NONE"
          PY
          )
