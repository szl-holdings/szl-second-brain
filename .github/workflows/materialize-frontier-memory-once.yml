# SPDX-License-Identifier: Apache-2.0
name: Materialize frontier memory once

on:
  push:
    branches:
      - feat/continuous-frontier-memory-v1-20260904
    paths:
      - .github/workflows/materialize-frontier-memory-once.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/continuous-frontier-memory-v1-20260904
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install source-test toolchain
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          -r requirements.txt "pytest>=8,<9" "build>=1.2,<2"

      - name: Build and prove the exact current candidate set
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/refresh_frontier_memory.py
          python -m py_compile scripts/refresh_frontier_memory.py second_brain/frontier.py app_operational.py
          PYTHONPATH=. python -m pytest -q
          python -m build --wheel
          git diff --check

      - name: Commit only the durable candidate data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add data/frontier-candidates.public.jsonl data/frontier-state.v1.json
          git diff --cached --quiet && { echo "no candidate data changes"; exit 1; }
          digest="$(python -c 'import json; print(json.load(open("data/frontier-state.v1.json"))["candidate_set_sha256"][:16])')"
          git commit -s -m "feat(brain): materialize frontier memory ${digest}"
          git push origin HEAD:feat/continuous-frontier-memory-v1-20260904
