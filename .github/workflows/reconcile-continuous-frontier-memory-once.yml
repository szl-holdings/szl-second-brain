# SPDX-License-Identifier: Apache-2.0
name: Reconcile continuous frontier memory once

on:
  push:
    branches:
      - feat/continuous-frontier-memory-v1-20260904
    paths:
      - .github/workflows/reconcile-continuous-frontier-memory-once.yml

permissions:
  contents: write

concurrency:
  group: reconcile-continuous-frontier-memory-once
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/continuous-frontier-memory-v1-20260904
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile protected main without force
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feat/continuous-frontier-memory-v1-20260904"
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          before_sha="$(git rev-parse HEAD)"
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge -X ours --no-ff origin/main \
              -m "chore(brain): reconcile protected main ${main_sha:0:12}" \
              -m "Preserve the continuous frontier-memory implementation while incorporating every current protected-main commit and validating the complete combined behavior." \
              -m "Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>"
          fi
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "::error::Semantic conflicts remain after bounded merge strategy."
            git diff --name-only --diff-filter=U
            exit 2
          fi
          git merge-base --is-ancestor "$main_sha" HEAD
          while IFS= read -r -d '' path; do
            test -e "$path" || { echo "::error::Protected-main path disappeared: $path"; exit 3; }
          done < <(git ls-tree -r -z --name-only "$main_sha")
          printf '%s\n' "before=$before_sha" "main=$main_sha" "combined=$(git rev-parse HEAD)"

      - name: Prove the combined Brain feature set
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            -r requirements.txt "pytest>=8,<9" "build>=1.2,<2"
          python -m py_compile \
            scripts/refresh_frontier_memory.py \
            second_brain/frontier.py \
            app_operational.py
          PYTHONPATH=. python -m pytest -q
          python -m build --wheel
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          required_paths = (
              root / 'second_brain' / 'frontier.py',
              root / 'scripts' / 'refresh_frontier_memory.py',
              root / 'data' / 'frontier-state.v1.json',
              root / 'data' / 'frontier-candidates.public.jsonl',
          )
          for path in required_paths:
              assert path.is_file() and path.stat().st_size > 0, path

          source = '\n'.join(
              path.read_text(encoding='utf-8', errors='ignore')
              for path in root.rglob('*') if path.is_file() and path.suffix in {'.py', '.md', '.json', '.toml'}
          )
          for marker in (
              'AuthorizedFrontierHydrator',
              'frontier_status',
              'frontier_search',
              'HANDLES_ONLY',
              'REVIEW_REQUIRED',
              'training_authority',
              'promotion_authority',
              'execution_authority',
              'Funes',
              'NeoMME',
              'FineWeb',
          ):
              assert marker in source, marker

          state = json.loads((root / 'data' / 'frontier-state.v1.json').read_text(encoding='utf-8'))
          assert state.get('candidate_set_sha256')
          assert state.get('candidate_count', 0) > 0
          assert state.get('source_count', 0) >= 6
          encoded = json.dumps(state, sort_keys=True)
          assert 'PRIVATE_GRAPH' not in encoded.upper()
          PY
          git diff --check

      - name: Remove one-use workflow and publish reconciled head
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/reconcile-continuous-frontier-memory-once.yml
          git add -A
          git diff --cached --check
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git commit -s -m "chore(brain): finalize protected-main reconciliation"
          git push origin HEAD:feat/continuous-frontier-memory-v1-20260904
